<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>CLANKO100 share image</title>
<style>
  @font-face{font-family:"Chakra Petch";src:url(../assets/fonts/chakra-petch-700.woff) format("woff");font-weight:700}
  @font-face{font-family:"Sora";src:url(../assets/fonts/sora-var.woff) format("woff");font-weight:100 800}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#080a1f;color:#eef0ff;font-family:Sora,sans-serif}
  .bg i{position:absolute;border-radius:50%;filter:blur(70px)}
  .bg i:nth-child(1){width:560px;height:560px;left:-160px;top:-220px;background:rgba(47,184,255,.45)}
  .bg i:nth-child(2){width:620px;height:620px;right:-120px;bottom:-300px;background:rgba(166,91,255,.5)}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(140,150,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(140,150,255,.12) 1px,transparent 1px);background-size:44px 44px;
    -webkit-mask-image:radial-gradient(70% 70% at 30% 40%,#000 10%,transparent 70%)}
  .left{position:absolute;left:64px;top:64px;width:600px}
  .brand{display:flex;align-items:center;gap:14px;font-family:"Chakra Petch";font-weight:700;font-size:38px;letter-spacing:.03em}
  .brand b{background:linear-gradient(100deg,#6fd6ff,#2fb8ff 35%,#a65bff 85%);-webkit-background-clip:text;color:transparent}
  h1{margin:46px 0 0;font-family:"Chakra Petch";font-weight:700;font-size:96px;line-height:.92;text-transform:uppercase}
  h1 span{display:block;background:linear-gradient(100deg,#9be6ff,#2fb8ff 35%,#a65bff 85%,#d7b3ff);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(47,184,255,.55)) drop-shadow(0 0 40px rgba(166,91,255,.45))}
  p{margin:28px 0 0;font-size:26px;color:#b4b9e6}
  .shots{position:absolute;right:-40px;top:-30px;width:560px;display:grid;grid-template-columns:1fr 1fr;gap:16px;transform:rotate(-8deg)}
  .shots img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;box-shadow:0 0 0 1px rgba(140,150,255,.3),0 18px 40px rgba(0,0,0,.5)}
  .shots img:nth-child(odd){transform:translateY(40px)}
</style>
</head>
<body>
<div class="bg"><i></i><i></i></div>
<div class="grid"></div>
<div class="shots">
  <img src="../assets/thumbs/blocklands.webp" alt=""><img src="../assets/thumbs/star-blaster.webp" alt="">
  <img src="../assets/thumbs/neon-drift.webp" alt=""><img src="../assets/thumbs/shadow-maze.webp" alt="">
  <img src="../assets/thumbs/arena-survivor.webp" alt=""><img src="../assets/thumbs/neon-2048.webp" alt="">
  <img src="../assets/thumbs/neon-runner.webp" alt=""><img src="../assets/thumbs/hoop-star.webp" alt="">
</div>
<div class="left">
  <div class="brand"><svg width="54" height="54" viewBox="0 0 40 40"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fdcff"/><stop offset=".45" stop-color="#2fb8ff"/><stop offset="1" stop-color="#a65bff"/></linearGradient></defs><path d="M9 0h31v31l-9 9H0V9z" fill="url(#g)"/><path d="M27.8 13.2A10 10 0 1 0 27.8 26.8" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/><path d="M18 15.2 25.4 20 18 24.8z" fill="#fff"/></svg><span>CLANKO<b>100</b></span></div>
  <h1><span>Your next</span><span>game starts</span><span>here.</span></h1>
  <p>20 free browser games. No downloads.</p>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Neon Snake | CLANKO100</title>
<link rel="stylesheet" href="../kit/kit.css">
</head>
<body data-game="neon-snake" style="--game-bg:#060718">
<div id="stage"></div>
<script src="../kit/kit.js"></script>
<script>
(function () {
  "use strict";
  var K = Kit, C = K.C;
  var COLS = 24, ROWS = 24, CELL = 25, TOP = 60;
  var ctx = K.canvas(COLS * CELL, ROWS * CELL + TOP);
  var fx = new K.Particles();

  var mode = K.store.get("mode", "walls"); // walls | wrap
  var snake, prev, dir, queue, food, bonus, eaten, score, tick, acc, alive, deathT, t = 0, flash = 0;

  function reset() {
    snake = []; for (var i = 0; i < 4; i++) snake.push({ x: 8 - i, y: 12 });
    prev = snake.map(function (s) { return { x: s.x, y: s.y }; });
    dir = { x: 1, y: 0 }; queue = []; eaten = 0; score = 0; tick = 0.115; acc = 0; alive = true; deathT = 0; bonus = null;
    food = freeCell(); fx.clear();
  }
  function occupied(x, y) { for (var i = 0; i < snake.length; i++) if (snake[i].x === x && snake[i].y === y) return true; return false; }
  function freeCell() {
    for (var n = 0; n < 2000; n++) {
      var c = { x: K.randi(0, COLS - 1), y: K.randi(0, ROWS - 1) };
      if (!occupied(c.x, c.y) && !(food && food.x === c.x && food.y === c.y) && !(bonus && bonus.x === c.x && bonus.y === c.y)) return c;
    }
    return { x: 0, y: 0 };
  }
  function turn(nx, ny) {
    if (K.state !== "play" || !alive) return;
    var last = queue.length ? queue[queue.length - 1] : dir;
    if ((nx === -last.x && ny === -last.y) || (nx === last.x && ny === last.y)) return;
    if (queue.length < 3) queue.push({ x: nx, y: ny });
  }
  K.on("key", function (code) {
    if (code === "ArrowUp" || code === "KeyW") turn(0, -1);
    else if (code === "ArrowDown" || code === "KeyS") turn(0, 1);
    else if (code === "ArrowLeft" || code === "KeyA") turn(-1, 0);
    else if (code === "ArrowRight" || code === "KeyD") turn(1, 0);
  });
  K.on("swipe", function (d) { if (d === "up") turn(0, -1); else if (d === "down") turn(0, 1); else if (d === "left") turn(-1, 0); else turn(1, 0); });
  // Tap left/right of the head to turn on touch screens
  K.on("tap", function (p) {
    if (K.state !== "play" || !alive) return;
    var h = snake[0], hx = h.x * CELL + CELL / 2, hy = h.y * CELL + CELL / 2 + TOP;
    var dx = p.x - hx, dy = p.y - hy;
    if (dir.x !== 0) turn(0, dy < 0 ? -1 : 1); else turn(dx < 0 ? -1 : 1, 0);
  });

  function step() {
    if (queue.length) dir = queue.shift();
    var h = snake[0], nx = h.x + dir.x, ny = h.y + dir.y;
    if (mode === "wrap") { nx = (nx + COLS) % COLS; ny = (ny + ROWS) % ROWS; }
    else if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return die();
    var grow = (nx === food.x && ny === food.y) || (bonus && nx === bonus.x && ny === bonus.y);
    // tail moves away this tick unless growing, so it's safe to move into it
    for (var i = 0; i < snake.length - (grow ? 0 : 1); i++) if (snake[i].x === nx && snake[i].y === ny) return die();
    prev = snake.map(function (s) { return { x: s.x, y: s.y }; });
    snake.unshift({ x: nx, y: ny });
    prev.unshift({ x: h.x, y: h.y });
    if (nx === food.x && ny === food.y) {
      eaten++; score += 10; K.sfx("coin");
      fx.burst(nx * CELL + CELL / 2, ny * CELL + CELL / 2 + TOP, 18, { color: [C.pink, C.purple, "#fff"], speed: 180, life: 0.5 });
      tick = Math.max(0.055, tick - 0.0022);
      food = freeCell();
      if (eaten % 5 === 0) { var bc = freeCell(); bonus = { x: bc.x, y: bc.y, life: 6, max: 6 }; }
    } else if (bonus && nx === bonus.x && ny === bonus.y) {
      score += 50 + Math.round(bonus.life * 10); K.sfx("power");
      fx.burst(nx * CELL + CELL / 2, ny * CELL + CELL / 2 + TOP, 30, { color: [C.yellow, "#fff", C.orange], speed: 220, life: 0.7 });
      bonus = null;
    } else {
      snake.pop(); prev.pop();
    }
  }
  function die() {
    alive = false; deathT = 0.9; flash = 1; K.sfx("explode"); K.shake(10);
    var h = snake[0];
    fx.burst(h.x * CELL + CELL / 2, h.y * CELL + CELL / 2 + TOP, 50, { color: [C.blue, C.purple, "#fff"], speed: 260, life: 0.9 });
  }

  function update(dt) {
    t += dt; fx.update(dt); flash = Math.max(0, flash - dt * 2.5);
    if (K.state !== "play") return;
    if (!alive) {
      deathT -= dt;
      if (deathT <= 0 && K.state === "play") {
        K.over({ score: score, extra: '<div class="k-best">Length ' + snake.length + "</div>", onRestart: start });
      }
      return;
    }
    if (bonus) { bonus.life -= dt; if (bonus.life <= 0) bonus = null; }
    acc += dt;
    while (acc >= tick && alive) { acc -= tick; step(); }
  }

  function segPos(i, a) {
    var c = snake[i], p = prev[i] || c;
    if (Math.abs(c.x - p.x) > 1 || Math.abs(c.y - p.y) > 1) p = c; // wrapped
    return { x: K.lerp(p.x, c.x, a) * CELL + CELL / 2, y: K.lerp(p.y, c.y, a) * CELL + CELL / 2 + TOP };
  }

  function draw(ctx) {
    var W = K.W, H = K.H;
    ctx.save();
    K.applyShake(ctx, 1 / 60);
    ctx.fillStyle = "#060718"; ctx.fillRect(-20, -20, W + 40, H + 40);
    // board
    var g = ctx.createLinearGradient(0, TOP, 0, H);
    g.addColorStop(0, "#0b0d2a"); g.addColorStop(1, "#0a0820");
    ctx.fillStyle = g; ctx.fillRect(0, TOP, W, H - TOP);
    ctx.strokeStyle = "rgba(120,130,255,0.07)"; ctx.lineWidth = 1; ctx.beginPath();
    for (var x = 1; x < COLS; x++) { ctx.moveTo(x * CELL + 0.5, TOP); ctx.lineTo(x * CELL + 0.5, H); }
    for (var y = 1; y < ROWS; y++) { ctx.moveTo(0, TOP + y * CELL + 0.5); ctx.lineTo(W, TOP + y * CELL + 0.5); }
    ctx.stroke();
    ctx.strokeStyle = mode === "walls" ? "rgba(47,184,255,0.75)" : "rgba(166,91,255,0.35)";
    ctx.lineWidth = 2; K.glow(ctx, C.blue, mode === "walls" ? 10 : 0);
    if (mode === "wrap") ctx.setLineDash([8, 8]);
    ctx.strokeRect(1, TOP + 1, W - 2, H - TOP - 2); ctx.setLineDash([]); K.noGlow(ctx);

    // food
    var pulse = 1 + Math.sin(t * 6) * 0.12;
    var fxp = food.x * CELL + CELL / 2, fyp = food.y * CELL + CELL / 2 + TOP;
    K.glow(ctx, C.pink, 16); ctx.fillStyle = C.pink;
    ctx.beginPath(); ctx.arc(fxp, fyp, 7 * pulse, 0, Math.PI * 2); ctx.fill(); K.noGlow(ctx);
    ctx.fillStyle = "rgba(255,255,255,.8)"; ctx.beginPath(); ctx.arc(fxp - 2, fyp - 2.5, 2, 0, Math.PI * 2); ctx.fill();
    if (bonus) {
      var bx = bonus.x * CELL + CELL / 2, by = bonus.y * CELL + CELL / 2 + TOP;
      K.glow(ctx, C.yellow, 18); ctx.fillStyle = C.yellow;
      ctx.beginPath();
      for (var k = 0; k < 10; k++) { var r = k % 2 ? 4.5 : 10.5, an = -Math.PI / 2 + k * Math.PI / 5 + t; ctx.lineTo(bx + Math.cos(an) * r * pulse, by + Math.sin(an) * r * pulse); }
      ctx.closePath(); ctx.fill(); K.noGlow(ctx);
      ctx.strokeStyle = "rgba(255,216,74,.6)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(bx, by, 15, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (bonus.life / bonus.max)); ctx.stroke();
    }

    // snake
    var a = alive && K.state === "play" ? Math.min(1, acc / tick) : 1;
    var n = snake.length;
    for (var i = n - 1; i >= 0; i--) {
      var p = segPos(i, a), f = i / Math.max(1, n - 1);
      var col = "hsl(" + Math.round(198 + f * 80) + ",100%," + Math.round(62 - f * 6) + "%)";
      var rad = (i === 0 ? 11 : 10 - f * 3.5);
      if (i === 0) K.glow(ctx, C.blue, 18);
      ctx.fillStyle = alive || deathT > 0.5 || Math.floor(t * 12) % 2 ? col : "#ffffff";
      ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, Math.PI * 2); ctx.fill();
      if (i > 0) { // connector to the next segment for a smooth body
        var q = segPos(i - 1, a);
        if (Math.abs(q.x - p.x) <= CELL * 1.1 && Math.abs(q.y - p.y) <= CELL * 1.1) {
          ctx.strokeStyle = col; ctx.lineWidth = rad * 2; ctx.lineCap = "round";
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
        }
      }
      if (i === 0) K.noGlow(ctx);
    }
    // eyes
    var hp = segPos(0, a), ex = dir.x, ey = dir.y, px = -ey, py = ex;
    for (var s = -1; s <= 1; s += 2) {
      var cx = hp.x + ex * 4 + px * 5 * s, cy = hp.y + ey * 4 + py * 5 * s;
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(cx, cy, 3.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#0a0a22"; ctx.beginPath(); ctx.arc(cx + ex * 1.3, cy + ey * 1.3, 1.7, 0, Math.PI * 2); ctx.fill();
    }

    fx.draw(ctx);

    // HUD
    ctx.fillStyle = "#060718"; ctx.fillRect(0, 0, W, TOP);
    K.text(ctx, "Score", 18, 22, { size: 13, color: C.muted, family: "body", weight: 600 });
    K.text(ctx, String(score), 18, 44, { size: 24, color: "#fff", glow: 10, glowColor: C.blue });
    K.text(ctx, "Best", 150, 22, { size: 13, color: C.muted, family: "body", weight: 600 });
    K.text(ctx, String(K.best()), 150, 44, { size: 24, color: "#cfd3ff" });
    K.text(ctx, mode === "walls" ? "Walls" : "Wrap", 270, 34, { size: 13, color: mode === "walls" ? C.blue : C.purple, family: "body", weight: 600 });
    if (flash > 0) { ctx.fillStyle = "rgba(255,80,140," + flash * 0.35 + ")"; ctx.fillRect(0, 0, W, H); }
    ctx.restore();
  }

  function start() { reset(); K.state = "play"; if (K.thumb) thumbScene(); }
  function menu() {
    K.menu({
      title: "Neon Snake",
      html: '<div class="k-row" role="group" aria-label="Mode">' +
        '<button type="button" class="k-chip" data-mode="walls">Walls</button>' +
        '<button type="button" class="k-chip" data-mode="wrap">Wrap around</button></div>',
      body: "Eat the pink orbs to grow. Grab gold stars before they fade. <kbd>Arrows</kbd> or <kbd>WASD</kbd> to steer, swipe or tap on touch screens.",
      onStart: start,
      onShow: function (el) {
        function sync() { Array.prototype.forEach.call(el.querySelectorAll("[data-mode]"), function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-mode") === mode)); }); }
        Array.prototype.forEach.call(el.querySelectorAll("[data-mode]"), function (b) {
          b.addEventListener("click", function () { mode = b.getAttribute("data-mode"); K.store.set("mode", mode); K.sfx("click"); sync(); });
        });
        sync();
      }
    });
  }
  K.onRestart = start;

  reset();
  function thumbScene() {
    snake = [];
    var path = [[14,9],[13,9],[12,9],[11,9],[10,9],[9,9],[9,10],[9,11],[9,12],[10,12],[11,12],[12,12],[13,12],[14,12],[15,12],[15,13],[15,14],[15,15],[14,15],[13,15],[12,15]];
    path.forEach(function (c) { snake.push({ x: c[0], y: c[1] }); });
    prev = snake.map(function (s) { return { x: s.x, y: s.y }; });
    food = { x: 18, y: 9 }; bonus = { x: 6, y: 16, life: 4, max: 6 }; score = 230;
    tick = 99;
  }
  menu();
  K.loop(update, draw);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Memory Match | CLANKO100</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
  body{overflow:auto;touch-action:manipulation;background:radial-gradient(100% 70% at 50% 0%,#24125a 0%,#0b0a26 60%,#070818 100%)}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:52px 12px 18px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
  .stat{min-width:70px;padding:5px 10px;text-align:center;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px}
  .stat small{display:block;font-size:11px;color:var(--muted)}
  .stat b{font-family:var(--display);font-size:20px}
  .grid{display:grid;gap:var(--gap);perspective:900px}
  .card{appearance:none;border:0;padding:0;width:var(--cw);height:calc(var(--cw)*1.18);background:none;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform .32s ease}
  .card.up,.card.done{transform:rotateY(180deg)}
  .card:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:12px}
  .face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
  .back{background:linear-gradient(145deg,#2b2f86,#1a1b52);border:1px solid rgba(140,150,255,.35);box-shadow:inset 0 0 0 4px rgba(255,255,255,.03)}
  .back{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 6px,transparent 6px 12px),linear-gradient(145deg,#2b2f86,#1a1b52)}
  .back::after{content:"";width:34%;height:34%;border-radius:50%;border:3px solid rgba(47,184,255,.5);box-shadow:0 0 14px rgba(47,184,255,.35),inset 0 0 10px rgba(166,91,255,.4)}
  .front{transform:rotateY(180deg);background:#0e0f2e;border:1px solid rgba(140,150,255,.35)}
  .front svg{width:58%;height:58%;filter:drop-shadow(0 0 8px currentColor)}
  .card.done .front{border-color:currentColor;box-shadow:0 0 18px -2px currentColor}
  .card.done{cursor:default}
  .card.shake{animation:sh .35s}
  @keyframes sh{0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-5px)}75%{transform:rotateY(180deg) translateX(5px)}}
  @media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body data-game="memory-match" style="--game-bg:#0b0a26">
<div class="wrap">
  <div class="bar k-ui" role="group" aria-label="Board size">
    <button type="button" class="k-chip" data-l="0">Easy 12</button>
    <button type="button" class="k-chip" data-l="1">Medium 20</button>
    <button type="button" class="k-chip" data-l="2">Hard 30</button>
  </div>
  <div class="bar">
    <div class="stat"><small>Moves</small><b id="moves">0</b></div>
    <div class="stat"><small>Pairs</small><b id="pairs">0</b></div>
    <div class="stat"><small>Time</small><b id="time">0:00</b></div>
    <button type="button" class="k-btn small k-ui" id="restart">Shuffle</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script src="../kit/kit.js"></script>
<script>
(function () {
  "use strict";
  var K = Kit;
  K.pausable = false; K.state = "play"; K.updateToolbar();
  var LEVELS = [{ c: 4, r: 3 }, { c: 5, r: 4 }, { c: 6, r: 5 }];
  var S = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
  var ICONS = [
    ["#ffd84a", '<path ' + S + ' d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/>'],
    ["#ff4fd8", '<path ' + S + ' d="M12 20s-7.5-4.6-7.5-10.1A4.3 4.3 0 0 1 12 7.1a4.3 4.3 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20z"/>'],
    ["#45f0ff", '<path ' + S + ' d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12z"/>'],
    ["#c9b6ff", '<path ' + S + ' d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5z"/>'],
    ["#3dffa8", '<path ' + S + ' d="M12 2.5l8 9.5-8 9.5L4 12z"/><path ' + S + ' d="M4 12h16"/>'],
    ["#ff9a3d", '<path ' + S + ' d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/>'],
    ["#2fb8ff", '<path ' + S + ' d="M12 3c4.4 0 7 3.2 7 7.5V21l-2.3-1.8L14.3 21 12 19.2 9.7 21l-2.4-1.8L5 21V10.5C5 6.2 7.6 3 12 3z"/><circle cx="9.5" cy="10" r="1" fill="currentColor"/><circle cx="14.5" cy="10" r="1" fill="currentColor"/>'],
    ["#ff4b6e", '<path ' + S + ' d="M12 21c-4 0-6.5-2.7-6.5-6.3 0-4 3.5-6 3.5-10 2.4 1.6 3.4 3.6 3.5 5.6 1-.8 1.7-2 1.9-3.4 2.4 2 4.1 4.6 4.1 7.8 0 3.6-2.5 6.3-6.5 6.3z"/>'],
    ["#a65bff", '<path ' + S + ' d="M9 18V5l11-2v13"/><circle ' + S + ' cx="6.5" cy="18" r="2.5"/><circle ' + S + ' cx="17.5" cy="16" r="2.5"/>'],
    ["#ffd84a", '<circle ' + S + ' cx="12" cy="12" r="5"/><path ' + S + ' d="M2.5 15.5c3-1.6 6.3-2.9 10-4 3.7-1 6.9-1.6 9-1.5"/>'],
    ["#3dffa8", '<path ' + S + ' d="M5 19c0-9 6-14 15-14 0 9-5 15-14 15"/><path ' + S + ' d="M5 19L13 11"/>'],
    ["#ff9a3d", '<circle ' + S + ' cx="8" cy="12" r="4"/><path ' + S + ' d="M12 12h9M18 12v3M21 12v2"/>'],
    ["#45f0ff", '<path ' + S + ' d="M12 3s6 6.4 6 11a6 6 0 0 1-12 0c0-4.6 6-11 6-11z"/>'],
    ["#c9b6ff", '<path ' + S + ' d="M7 18h10.5a4 4 0 0 0 .4-8 6 6 0 0 0-11.6 1.4A3.3 3.3 0 0 0 7 18z"/>'],
    ["#ffd84a", '<circle ' + S + ' cx="12" cy="12" r="4"/><path ' + S + ' d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>'],
    ["#ff4fd8", '<path ' + S + ' d="M12 3.5l9 15.5H3z"/>'],
    ["#2fb8ff", '<path ' + S + ' d="M7 4.5h10l5 7.5-5 7.5H7L2 12z"/>'],
    ["#3dffa8", '<rect ' + S + ' x="3" y="7" width="18" height="10" rx="5"/><path ' + S + ' d="M7.5 10.5v3M6 12h3"/><circle cx="15.5" cy="11" r="1" fill="currentColor"/><circle cx="17.5" cy="13" r="1" fill="currentColor"/>']
  ];
  var lvl = K.store.get("level", 0), gridEl = document.getElementById("grid");
  var deck, first, second, lock, moves, pairs, total, t0, timer, startedAt;

  function size() {
    var L = LEVELS[lvl], gap = 10;
    var cw = Math.floor(Math.min((window.innerWidth - 30 - gap * (L.c - 1)) / L.c, ((window.innerHeight - 170 - gap * (L.r - 1)) / L.r) / 1.18, 110));
    cw = Math.max(cw, 44);
    document.documentElement.style.setProperty("--cw", cw + "px"); document.documentElement.style.setProperty("--gap", gap + "px");
    gridEl.style.gridTemplateColumns = "repeat(" + L.c + ", var(--cw))";
  }
  function deal() {
    var L = LEVELS[lvl]; total = L.c * L.r / 2;
    var picks = K.shuffle(ICONS.map(function (_, i) { return i; })).slice(0, total);
    deck = K.shuffle(picks.concat(picks));
    first = second = null; lock = false; moves = 0; pairs = 0; startedAt = null; clearInterval(timer);
    document.getElementById("time").textContent = "0:00";
    gridEl.innerHTML = "";
    deck.forEach(function (ic, i) {
      var b = document.createElement("button"); b.type = "button"; b.className = "card"; b.dataset.i = i; b.style.color = ICONS[ic][0];
      b.setAttribute("aria-label", "Hidden card");
      b.innerHTML = '<span class="face back"></span><span class="face front"><svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[ic][1] + "</svg></span>";
      gridEl.appendChild(b);
    });
    size(); stats();
    document.querySelectorAll("[data-l]").forEach(function (b) { b.setAttribute("aria-pressed", String(+b.dataset.l === lvl)); });
  }
  function stats() { document.getElementById("moves").textContent = moves; document.getElementById("pairs").textContent = pairs + "/" + total; }
  function flip(b) {
    if (lock || b.classList.contains("up") || b.classList.contains("done")) return;
    if (!startedAt) { startedAt = Date.now(); timer = setInterval(function () { document.getElementById("time").textContent = K.time((Date.now() - startedAt) / 1000); }, 300); }
    b.classList.add("up"); b.setAttribute("aria-label", "Card " + b.dataset.i + " face up"); K.sfx("click");
    if (!first) { first = b; return; }
    second = b; moves++; stats();
    var a = deck[+first.dataset.i], c = deck[+second.dataset.i];
    if (a === c) {
      var f = first, s = second; first = second = null;
      setTimeout(function () { f.classList.add("done"); s.classList.add("done"); f.setAttribute("aria-label", "Matched"); s.setAttribute("aria-label", "Matched"); K.sfx("coin"); }, 260);
      pairs++; stats();
      if (pairs === total) setTimeout(win, 700);
    } else {
      lock = true;
      setTimeout(function () { first.classList.add("shake"); second.classList.add("shake"); K.sfx("beep"); }, 350);
      setTimeout(function () { [first, second].forEach(function (x) { x.classList.remove("up", "shake"); x.setAttribute("aria-label", "Hidden card"); }); first = second = null; lock = false; }, 950);
    }
  }
  function win() {
    clearInterval(timer); K.sfx("win");
    var secs = Math.round((Date.now() - startedAt) / 1000), par = total * 1.6, stars = moves <= par ? 3 : moves <= par * 1.4 ? 2 : 1;
    var key = "best_" + lvl, b = K.store.get(key, null), isNew = b == null || moves < b.m || (moves === b.m && secs < b.s);
    if (isNew) K.store.set(key, { m: moves, s: secs });
    K.screen({
      title: "All matched!",
      html: '<div class="k-score" style="color:#ffd84a;letter-spacing:6px">' + "★★★".slice(0, stars) + '<span style="opacity:.25">' + "★★★".slice(0, 3 - stars) + "</span></div>" +
        '<div class="k-best">' + moves + " moves in " + K.time(secs) + "</div>" + (isNew ? '<div class="k-new">New best!</div>' : '<div class="k-best">Best: ' + b.m + " moves</div>") + '<div style="height:16px"></div>',
      button: lvl < 2 ? "Next size" : "Play again", secondary: lvl < 2 ? [{ label: "Same size", onClick: function () { K.hideScreen(); K.state = "play"; deal(); } }] : [],
      onStart: function () { if (lvl < 2) { lvl++; K.store.set("level", lvl); } deal(); }, credit: false
    });
  }
  gridEl.addEventListener("click", function (e) { var b = e.target.closest(".card"); if (b) flip(b); });
  document.getElementById("restart").addEventListener("click", function () { K.sfx("select"); deal(); });
  document.querySelectorAll("[data-l]").forEach(function (b) { b.addEventListener("click", function () { lvl = +b.dataset.l; K.store.set("level", lvl); K.sfx("click"); deal(); }); });
  window.addEventListener("resize", size);
  deal();
  if (K.thumb) {
    var cards = gridEl.querySelectorAll(".card"), shown = {};
    deck.forEach(function (ic, i) { if (ic === deck[0] || ic === deck[3] || ic === deck[5]) cards[i].classList.add("done"); });
    cards[7].classList.add("up"); moves = 9; pairs = 3; stats();
  }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Neon Breaker | CLANKO100</title>
<link rel="stylesheet" href="../kit/kit.css">
</head>
<body data-game="neon-breaker" style="--game-bg:#070818">
<div id="stage"></div>
<script src="../kit/kit.js"></script>
<script>
(function () {
  "use strict";
  var K = Kit, C = K.C;
  var W = 640, H = 720, COLS = 10, BW = 58, BH = 22, GAP = 4, OX = (W - (COLS * BW + (COLS - 1) * GAP)) / 2, OY = 90;
  var ctx = K.canvas(W, H);
  var fx = new K.Particles();
  var paddle, balls, bricks, drops, lasers, lives, score, level, laserT, wideT, slowT, t = 0, msg, msgT, launchHint;
  var ROWCOL = [C.pink, C.orange, C.yellow, C.green, C.cyan, C.blue, C.purple, "#ff6fa8"];

  var PATTERNS = [
    function (r, c) { return r < 5 ? 1 : 0; },
    function (r, c) { return r < 7 && (c + r) % 2 === 0 ? 1 : (r === 7 ? 0 : 0); },
    function (r, c) { return r < 7 && Math.abs(c - 4.5) <= r * 0.7 + 0.5 ? (r === 0 ? 2 : 1) : 0; },
    function (r, c) { return r < 7 ? ((c === 0 || c === 9 || r === 0) ? 2 : (r % 2 ? 1 : 0)) : 0; },
    function (r, c) { return r < 8 ? ((r === 3 && c > 1 && c < 8) ? 3 : (r + c) % 3 ? 1 : 2) : 0; },
    function (r, c) { return r < 8 && (c < 3 || c > 6 || r < 2) ? (r < 2 ? 2 : 1) : 0; },
    function (r, c) { var d = Math.hypot(c - 4.5, r - 3.5); return d < 4.2 ? (d < 1.8 ? 2 : 1) : 0; },
    function (r, c) { return r < 8 ? ((r === 2 || r === 5) && c % 3 !== 1 ? 3 : 1 + (r < 2 ? 1 : 0)) : 0; }
  ];

  function buildLevel(n) {
    bricks = [];
    var pat = PATTERNS[(n - 1) % PATTERNS.length], extra = Math.floor((n - 1) / PATTERNS.length);
    for (var r = 0; r < 8; r++) for (var c = 0; c < COLS; c++) {
      var v = pat(r, c); if (!v) continue;
      var hp = v === 3 ? Infinity : v === 2 ? 2 + extra : 1 + (extra > 1 ? 1 : 0);
      bricks.push({ x: OX + c * (BW + GAP), y: OY + r * (BH + GAP), w: BW, h: BH, hp: hp, max: hp, col: ROWCOL[r % 8], steel: v === 3, bonus: v !== 3 && Math.random() < 0.13, hit: 0 });
    }
    resetBall(); drops = []; lasers = []; laserT = 0; wideT = 0; slowT = 0;
    msg = "Level " + n; msgT = 1.6;
  }
  function baseSpeed() { return Math.min(700, 420 + (level - 1) * 26); }
  function resetBall() { balls = [{ x: paddle.x, y: paddle.y - 16, vx: 0, vy: 0, r: 8, stuck: true }]; launchHint = true; }
  function reset() { paddle = { x: W / 2, y: H - 46, w: 110, h: 14, tx: W / 2 }; lives = 3; score = 0; level = 1; fx.clear(); buildLevel(1); }

  function launch() {
    balls.forEach(function (b) { if (b.stuck) { var a = -Math.PI / 2 + K.rand(-0.35, 0.35); b.vx = Math.cos(a) * baseSpeed(); b.vy = Math.sin(a) * baseSpeed(); b.stuck = false; } });
    launchHint = false; K.sfx("select");
  }
  K.on("move", function (p) { if (K.state === "play") paddle.tx = p.x; });
  K.on("down", function (p) { if (K.state === "play") { paddle.tx = p.x; if (balls.some(function (b) { return b.stuck; })) launch(); else fireLaser(); } });
  K.on("key", function (code) { if (K.state !== "play") return; if (code === "Space" || code === "ArrowUp" || code === "KeyW") { if (balls.some(function (b) { return b.stuck; })) launch(); else fireLaser(); } });
  var laserCool = 0;
  function fireLaser() { if (laserT <= 0 || laserCool > 0) return; laserCool = 0.25; lasers.push({ x: paddle.x - paddle.w / 2 + 8, y: paddle.y - 8 }, { x: paddle.x + paddle.w / 2 - 8, y: paddle.y - 8 }); K.sfx("shoot"); }

  function hitBrick(br, b) {
    if (br.steel) { K.sfx("bounce"); br.hit = 1; return; }
    br.hp--; br.hit = 1;
    if (br.hp <= 0) {
      score += 10 * level; K.tone(400 + Math.random() * 400, 0.06, { type: "square", vol: 0.07 });
      fx.burst(br.x + br.w / 2, br.y + br.h / 2, 14, { color: [br.col, "#fff"], speed: 180, life: 0.5 });
      if (br.bonus) drops.push({ x: br.x + br.w / 2, y: br.y + br.h / 2, k: K.pick(["W", "M", "S", "L", "W", "M", "+"]) });
    } else K.sfx("bounce");
  }
  function collideBall(b) {
    for (var i = 0; i < bricks.length; i++) {
      var br = bricks[i]; if (br.hp <= 0) continue;
      var nx = K.clamp(b.x, br.x, br.x + br.w), ny = K.clamp(b.y, br.y, br.y + br.h), dx = b.x - nx, dy = b.y - ny;
      if (dx * dx + dy * dy < b.r * b.r) {
        var ox = Math.min(b.x + b.r - br.x, br.x + br.w - (b.x - b.r)), oy = Math.min(b.y + b.r - br.y, br.y + br.h - (b.y - b.r));
        if (ox < oy) { b.vx = -b.vx; b.x += b.x < br.x + br.w / 2 ? -ox : ox; } else { b.vy = -b.vy; b.y += b.y < br.y + br.h / 2 ? -oy : oy; }
        hitBrick(br, b); return;
      }
    }
  }

  function update(dt) {
    t += dt; fx.update(dt); if (msgT > 0) msgT -= dt;
    if (K.state !== "play") return;
    laserT = Math.max(0, laserT - dt); wideT = Math.max(0, wideT - dt); slowT = Math.max(0, slowT - dt); laserCool = Math.max(0, laserCool - dt);
    // paddle
    var kd = (K.held("right") ? 1 : 0) - (K.held("left") ? 1 : 0);
    if (kd) paddle.tx = paddle.x + kd * 700 * dt;
    var targetW = wideT > 0 ? 170 : 110; paddle.w = K.lerp(paddle.w, targetW, Math.min(1, dt * 10));
    paddle.x = K.clamp(K.lerp(paddle.x, paddle.tx, Math.min(1, dt * 22)), paddle.w / 2 + 4, W - paddle.w / 2 - 4);
    if (laserT > 0 && (K.keys.Space || K.pointer.down)) fireLaser();

    var spMul = slowT > 0 ? 0.65 : 1, steps = 3;
    for (var i = balls.length - 1; i >= 0; i--) {
      var b = balls[i];
      if (b.stuck) { b.x = paddle.x; b.y = paddle.y - 16; continue; }
      for (var s = 0; s < steps; s++) {
        var h = dt / steps;
        b.x += b.vx * h * spMul; b.y += b.vy * h * spMul;
        if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); K.sfx("bounce"); }
        if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); K.sfx("bounce"); }
        if (b.y < 60 + b.r) { b.y = 60 + b.r; b.vy = Math.abs(b.vy); K.sfx("bounce"); }
        if (b.vy > 0 && b.y + b.r > paddle.y - paddle.h / 2 && b.y < paddle.y + paddle.h && Math.abs(b.x - paddle.x) < paddle.w / 2 + b.r) {
          var off = K.clamp((b.x - paddle.x) / (paddle.w / 2), -1, 1), a = -Math.PI / 2 + off * 1.05, sp = Math.hypot(b.vx, b.vy) * 1.01;
          sp = Math.min(sp, baseSpeed() * 1.35);
          b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp; b.y = paddle.y - paddle.h / 2 - b.r;
          K.tone(260, 0.05, { type: "triangle", vol: 0.12 });
        }
        collideBall(b);
      }
      // prevent near-horizontal loops
      if (Math.abs(b.vy) < 90) b.vy = b.vy < 0 ? -90 : 90;
      if (b.y > H + 20) balls.splice(i, 1);
    }
    if (!balls.length) {
      lives--; K.sfx("lose"); K.shake(10);
      if (lives <= 0) { K.over({ score: score, extra: '<div class="k-best">Reached level ' + level + "</div>", onRestart: start }); return; }
      resetBall(); wideT = laserT = slowT = 0; msg = lives + (lives === 1 ? " life left" : " lives left"); msgT = 1.3;
    }
    // lasers
    for (i = lasers.length - 1; i >= 0; i--) {
      var l = lasers[i]; l.y -= 900 * dt; if (l.y < 60) { lasers.splice(i, 1); continue; }
      for (var j = 0; j < bricks.length; j++) { var br = bricks[j]; if (br.hp > 0 && l.x > br.x && l.x < br.x + br.w && l.y > br.y && l.y < br.y + br.h) { hitBrick(br); lasers.splice(i, 1); break; } }
    }
    // drops
    for (i = drops.length - 1; i >= 0; i--) {
      var d = drops[i]; d.y += 170 * dt;
      if (d.y > H + 20) { drops.splice(i, 1); continue; }
      if (Math.abs(d.x - paddle.x) < paddle.w / 2 + 12 && Math.abs(d.y - paddle.y) < 16) {
        drops.splice(i, 1); K.sfx("power"); score += 25;
        if (d.k === "W") { wideT = 15; K.toast("Wide paddle"); }
        if (d.k === "S") { slowT = 12; K.toast("Slow ball"); }
        if (d.k === "L") { laserT = 10; K.toast("Lasers! Click or press Space"); }
        if (d.k === "+") { lives = Math.min(6, lives + 1); K.toast("Extra life"); }
        if (d.k === "M") { var src = balls.filter(function (x) { return !x.stuck; })[0] || balls[0]; if (src) { if (src.stuck) launch(); [-0.5, 0.5].forEach(function (da) { var ang = Math.atan2(src.vy, src.vx) + da, spd = Math.hypot(src.vx, src.vy) || baseSpeed(); balls.push({ x: src.x, y: src.y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 8, stuck: false }); }); K.toast("Multi-ball"); } }
      }
    }
    bricks.forEach(function (br) { br.hit = Math.max(0, br.hit - dt * 5); });
    if (!bricks.some(function (br) { return br.hp > 0 && !br.steel; })) { score += 200 * level; level++; K.sfx("win"); buildLevel(level); }
  }

  function draw(ctx) {
    ctx.save(); K.applyShake(ctx, 1 / 60);
    var g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#0d0b2e"); g.addColorStop(1, "#060717");
    ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.strokeStyle = "rgba(120,130,255,.06)"; ctx.lineWidth = 1; ctx.beginPath();
    for (var x = 0; x <= W; x += 40) { ctx.moveTo(x, 60); ctx.lineTo(x, H); } for (var y = 60; y <= H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); } ctx.stroke();
    ctx.fillStyle = "rgba(47,184,255,.6)"; ctx.fillRect(0, 58, W, 2);
    // bricks
    bricks.forEach(function (br) {
      if (br.hp <= 0) return;
      var col = br.steel ? "#9aa3c8" : br.col;
      ctx.save();
      if (br.hit > 0) { K.glow(ctx, "#fff", 18); } else K.glow(ctx, col, 8);
      ctx.fillStyle = br.steel ? "#3a4060" : (br.max > 1 && br.hp < br.max ? "rgba(255,255,255,.12)" : col);
      K.roundRect(ctx, br.x, br.y, br.w, br.h, 5); ctx.fill(); K.noGlow(ctx);
      if (br.steel || br.max > 1) { ctx.strokeStyle = col; ctx.lineWidth = 2; K.roundRect(ctx, br.x + 1, br.y + 1, br.w - 2, br.h - 2, 5); ctx.stroke(); }
      ctx.fillStyle = "rgba(255,255,255,.28)"; ctx.fillRect(br.x + 5, br.y + 4, br.w - 10, 3);
      if (br.bonus) { ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.beginPath(); ctx.arc(br.x + br.w / 2, br.y + br.h / 2 + 2, 3, 0, Math.PI * 2); ctx.fill(); }
      if (br.max > 1 && !br.steel && br.hp < Infinity) K.text(ctx, String(br.hp), br.x + br.w / 2, br.y + br.h / 2 + 1, { size: 12, color: "#fff", align: "center" });
      ctx.restore();
    });
    // drops
    drops.forEach(function (d) {
      var col = { W: C.cyan, M: C.pink, S: C.green, L: C.red, "+": C.yellow }[d.k];
      K.glow(ctx, col, 12); ctx.fillStyle = col; K.roundRect(ctx, d.x - 18, d.y - 10, 36, 20, 10); ctx.fill(); K.noGlow(ctx);
      K.text(ctx, d.k, d.x, d.y + 1, { size: 14, color: "#0a0a22", align: "center" });
    });
    // lasers
    ctx.fillStyle = C.red; K.glow(ctx, C.red, 10); lasers.forEach(function (l) { ctx.fillRect(l.x - 2, l.y - 10, 4, 16); }); K.noGlow(ctx);
    // paddle
    var pg = ctx.createLinearGradient(paddle.x - paddle.w / 2, 0, paddle.x + paddle.w / 2, 0); pg.addColorStop(0, C.blue); pg.addColorStop(1, C.purple);
    K.glow(ctx, C.blue, 18); ctx.fillStyle = pg; K.roundRect(ctx, paddle.x - paddle.w / 2, paddle.y - paddle.h / 2, paddle.w, paddle.h, 7); ctx.fill(); K.noGlow(ctx);
    ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.fillRect(paddle.x - paddle.w / 2 + 10, paddle.y - 4, paddle.w - 20, 2);
    if (laserT > 0) { ctx.fillStyle = C.red; ctx.fillRect(paddle.x - paddle.w / 2 + 5, paddle.y - 14, 6, 8); ctx.fillRect(paddle.x + paddle.w / 2 - 11, paddle.y - 14, 6, 8); }
    // balls
    balls.forEach(function (b) { K.glow(ctx, "#bfeaff", 16); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); K.noGlow(ctx); });
    fx.draw(ctx);
    // HUD
    K.text(ctx, K.fmt(score), 16, 30, { size: 26, color: "#fff", glow: 10, glowColor: C.blue });
    K.text(ctx, "Level " + level, 180, 30, { size: 16, color: C.muted });
    for (var l = 0; l < lives; l++) { ctx.fillStyle = C.blue; K.roundRect(ctx, 290 + l * 30, 25, 24, 8, 4); ctx.fill(); }
    var pw = []; if (wideT > 0) pw.push("Wide " + Math.ceil(wideT)); if (slowT > 0) pw.push("Slow " + Math.ceil(slowT)); if (laserT > 0) pw.push("Laser " + Math.ceil(laserT));
    if (pw.length) K.text(ctx, pw.join("   "), W / 2, H - 14, { size: 12, color: C.cyan, align: "center", family: "body", weight: 600 });
    if (msgT > 0) { ctx.globalAlpha = Math.min(1, msgT * 2); K.text(ctx, msg, W / 2, H * 0.58, { size: 38, color: "#fff", align: "center", glow: 18, glowColor: C.purple }); ctx.globalAlpha = 1; }
    else if (launchHint && K.state === "play") K.text(ctx, K.isTouch ? "Tap to launch" : "Click or press Space to launch", W / 2, H * 0.62, { size: 16, color: "#fff", align: "center", family: "body", weight: 600 });
    ctx.restore();
  }

  function start() {
    reset(); K.state = "play";
    if (K.thumb) { K.thumbTime = 0.05; launch(); balls[0].x = 260; balls[0].y = 420; bricks.forEach(function (b, i) { if (i % 7 === 3) b.hp = 0; }); drops.push({ x: 420, y: 520, k: "M" }); score = 1840; msgT = 0; }
  }
  K.onRestart = start;
  reset();
  K.menu({
    title: "Neon Breaker",
    body: "Bounce the ball to smash every brick. Move with the mouse, a finger or <kbd>←</kbd> <kbd>→</kbd>. Catch falling capsules for a wide paddle, multi-ball, lasers and more.",
    onStart: start
  });
  K.loop(update, draw);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Arena Survivor | CLANKO100</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
  .ups{display:grid;gap:10px;margin:4px 0 6px}
  .up{appearance:none;cursor:pointer;text-align:left;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:12px 14px;border-radius:10px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);transition:border-color .15s,box-shadow .15s}
  .up:hover,.up:focus-visible{border-color:var(--blue);box-shadow:0 0 16px rgba(47,184,255,.45);outline:none}
  .up b{display:block;font-size:15px}
  .up span{font-size:12px;color:var(--muted)}
  .up kbd{font-family:var(--display);font-weight:700;font-size:16px;color:var(--blue)}
</style>
</head>
<body data-game="arena-survivor" style="--game-bg:#06061a">
<div id="stage"></div>
<script src="../kit/kit.js"></script>
<script>
(function () {
  "use strict";
  var K = Kit, C = K.C;
  var ctx = K.canvas(800, 500, { fill: { minW: 560, maxW: 1000 } });
  var fx = new K.Particles();
  var joy = K.joystick({ zone: 1, hint: "Drag anywhere to move" });
  var AW = 2400, AH = 2400, eid = 0;
  var P, enemies, bullets, ebullets, gems, time, kills, spawnT, choosing, nextBoss, dead, deadT, t = 0, cam = { x: 0, y: 0 }, upEl = null, bossRef = null;

  function reset() {
    P = { x: AW / 2, y: AH / 2, r: 14, hp: 100, max: 100, speed: 210, inv: 0, lvl: 1, xp: 0, need: 6,
      dmg: 10, rate: 0.5, fireT: 0, shots: 1, pierce: 0, magnet: 90, blades: 0, bladeA: 0, regen: 0, bsize: 5, bspeed: 620, face: 0 };
    enemies = []; bullets = []; ebullets = []; gems = []; time = 0; kills = 0; spawnT = 0.5; choosing = false; nextBoss = 150; dead = false; deadT = 0; bossRef = null; fx.clear();
  }
  var TYPES = {
    chaser: { r: 13, hp: 14, sp: 92, col: C.pink, xp: 1, dmg: 10 },
    runner: { r: 10, hp: 8, sp: 150, col: C.yellow, xp: 1, dmg: 8 },
    brute: { r: 22, hp: 70, sp: 62, col: C.purple, xp: 4, dmg: 18 },
    spitter: { r: 14, hp: 26, sp: 80, col: C.green, xp: 3, dmg: 8 },
    boss: { r: 46, hp: 1000, sp: 70, col: C.red, xp: 40, dmg: 30 }
  };
  function spawn(type) {
    var d = TYPES[type], a = Math.random() * Math.PI * 2, dist = Math.max(K.W, K.H) * 0.65 + 40;
    var x = K.clamp(P.x + Math.cos(a) * dist, 30, AW - 30), y = K.clamp(P.y + Math.sin(a) * dist, 30, AH - 30);
    var scale = 1 + time / 150;
    var e = { type: type, x: x, y: y, r: d.r, hp: d.hp * (type === "boss" ? 1 + time / 300 : scale), sp: d.sp * (type === "boss" ? 1 : Math.min(1.5, 1 + time / 600)), col: d.col, xp: d.xp, dmg: d.dmg, flash: 0, cool: K.rand(1, 2.5), kx: 0, ky: 0 };
    e.max = e.hp; e.id = ++eid; enemies.push(e);
    if (type === "boss") { bossRef = e; K.toast("A boss is coming!", 2200); K.sfx("lose"); }
  }

  /* ---------- upgrades ---------- */
  var UPS = [
    { id: "dmg", name: "Power shot", desc: "+30% damage", apply: function () { P.dmg *= 1.3; } },
    { id: "rate", name: "Rapid fire", desc: "Shoot 25% faster", apply: function () { P.rate *= 0.8; } },
    { id: "multi", name: "Split shot", desc: "+1 projectile", apply: function () { P.shots++; }, max: 6 },
    { id: "pierce", name: "Piercing rounds", desc: "Shots pass through +1 enemy", apply: function () { P.pierce++; }, max: 5 },
    { id: "speed", name: "Light boots", desc: "+12% move speed", apply: function () { P.speed *= 1.12; }, max: 5 },
    { id: "hp", name: "Tough skin", desc: "+25 max HP and heal fully", apply: function () { P.max += 25; P.hp = P.max; } },
    { id: "magnet", name: "Magnet", desc: "Pick up XP from 50% further", apply: function () { P.magnet *= 1.5; }, max: 4 },
    { id: "blade", name: "Orbit blade", desc: "+1 spinning blade that cuts enemies", apply: function () { P.blades++; }, max: 6 },
    { id: "regen", name: "Regeneration", desc: "Heal 1.5 HP every second", apply: function () { P.regen += 1.5; }, max: 4 },
    { id: "big", name: "Heavy rounds", desc: "Bigger, faster shots", apply: function () { P.bsize += 2; P.bspeed *= 1.15; }, max: 3 }
  ];
  var taken = {};
  function levelUp() {
    choosing = true; K.sfx("power");
    var pool = UPS.filter(function (u) { return !u.max || (taken[u.id] || 0) < u.max; });
    var picks = K.shuffle(pool.slice()).slice(0, 3);
    if (K.thumb) { choosing = false; return; }
    upEl = document.createElement("div"); upEl.className = "k-screen k-ui";
    upEl.innerHTML = '<div class="k-card"><h1 class="k-title">Level ' + P.lvl + '</h1><p class="k-body">Pick an upgrade</p><div class="ups">' +
      picks.map(function (u, i) { return '<button type="button" class="up" data-i="' + i + '"><kbd>' + (i + 1) + "</kbd><span><b>" + u.name + "</b><span>" + u.desc + (taken[u.id] ? " (have " + taken[u.id] + ")" : "") + "</span></span></button>"; }).join("") + "</div></div>";
    document.body.appendChild(upEl);
    function choose(i) { var u = picks[i]; if (!u) return; u.apply(); taken[u.id] = (taken[u.id] || 0) + 1; upEl.remove(); upEl = null; choosing = false; K.sfx("select"); window.removeEventListener("keydown", onKey); if (K._resetClock) K._resetClock(); }
    function onKey(e) { var n = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 }[e.code]; if (n != null) { e.preventDefault(); choose(n); } }
    window.addEventListener("keydown", onKey);
    upEl.querySelectorAll(".up").forEach(function (b) { b.addEventListener("click", function () { choose(+b.dataset.i); }); });
    setTimeout(function () { var f = upEl && upEl.querySelector(".up"); if (f) f.focus(); }, 50);
  }

  function nearest(range) {
    var best = null, bd = range * range;
    for (var i = 0; i < enemies.length; i++) { var e = enemies[i], dx = e.x - P.x, dy = e.y - P.y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = e; } }
    return best;
  }
  function hurt(e, dmg, kx, ky) {
    e.hp -= dmg; e.flash = 1; e.kx += kx || 0; e.ky += ky || 0;
    if (e.hp <= 0) {
      kills++; e.dead = true;
      fx.burst(e.x, e.y, e.type === "boss" ? 80 : 12, { color: [e.col, "#fff"], speed: e.type === "boss" ? 320 : 170, life: e.type === "boss" ? 1.2 : 0.45 });
      var drops = e.type === "boss" ? 12 : 1;
      for (var i = 0; i < drops; i++) gems.push({ x: e.x + K.rand(-20, 20) * (drops > 1), y: e.y + K.rand(-20, 20) * (drops > 1), v: e.type === "boss" ? 4 : e.xp, pull: false });
      if (e.type === "boss") { bossRef = null; K.sfx("explode"); K.shake(16); P.hp = Math.min(P.max, P.hp + 40); }
      else K.tone(200 + Math.random() * 120, 0.05, { type: "square", vol: 0.05 });
    }
  }

  function update(dt) {
    t += dt; fx.update(dt);
    if (K.state !== "play" || choosing) return;
    if (dead) { deadT -= dt; if (deadT <= 0) K.over({ score: kills * 10 + Math.floor(time) * 5, extra: '<div class="k-best">Survived ' + K.time(time) + " with " + kills + " defeats, level " + P.lvl + "</div>", onRestart: start }); return; }
    time += dt;
    // move
    var ax = K.axis();
    P.x = K.clamp(P.x + ax.x * P.speed * dt, P.r, AW - P.r); P.y = K.clamp(P.y + ax.y * P.speed * dt, P.r, AH - P.r);
    if (ax.x || ax.y) P.face = Math.atan2(ax.y, ax.x);
    P.inv = Math.max(0, P.inv - dt); P.hp = Math.min(P.max, P.hp + P.regen * dt);
    // shooting
    P.fireT -= dt;
    if (P.fireT <= 0) {
      var tgt = nearest(460);
      if (tgt) {
        P.fireT = P.rate; var base = Math.atan2(tgt.y - P.y, tgt.x - P.x), n = P.shots, spread = 0.13;
        for (var s = 0; s < n; s++) { var a = base + (s - (n - 1) / 2) * spread; bullets.push({ x: P.x, y: P.y, vx: Math.cos(a) * P.bspeed, vy: Math.sin(a) * P.bspeed, life: 0.9, pierce: P.pierce, hit: {} }); }
        K.sfx("shoot");
      }
    }
    // spawning
    spawnT -= dt;
    if (spawnT <= 0) {
      spawnT = Math.max(0.16, 0.95 - time / 210);
      var r = Math.random(), type = "chaser";
      if (time > 40 && r < 0.25) type = "runner";
      if (time > 75 && r > 0.9) type = "brute";
      if (time > 100 && r > 0.82 && r <= 0.9) type = "spitter";
      var group = time > 60 && Math.random() < 0.15 ? 5 : 1;
      for (var g = 0; g < group; g++) spawn(type);
    }
    if (time >= nextBoss) { nextBoss += 150; spawn("boss"); }
    // enemies
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i]; if (e.dead) continue;
      var dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1, sp = e.sp;
      if (e.type === "spitter" && d < 260) sp = -e.sp * 0.5;
      e.x += (dx / d * sp + e.kx) * dt; e.y += (dy / d * sp + e.ky) * dt; e.kx *= Math.pow(0.02, dt); e.ky *= Math.pow(0.02, dt);
      e.flash = Math.max(0, e.flash - dt * 8);
      if (e.type === "spitter" || e.type === "boss") { e.cool -= dt; if (e.cool <= 0 && d < 520) { e.cool = e.type === "boss" ? 1.4 : 2.4; var cnt = e.type === "boss" ? 12 : 1; for (var k = 0; k < cnt; k++) { var aa = Math.atan2(dy, dx) + (cnt > 1 ? k * Math.PI * 2 / cnt : 0); ebullets.push({ x: e.x, y: e.y, vx: Math.cos(aa) * 210, vy: Math.sin(aa) * 210, life: 3 }); } } }
      if (d < e.r + P.r && P.inv <= 0) { P.hp -= e.dmg; P.inv = 0.55; K.sfx("hit"); K.shake(6); if (P.hp <= 0) { die(); return; } }
    }
    // separation
    for (i = 0; i < enemies.length; i++) {
      var a1 = enemies[i]; if (a1.dead) continue;
      for (var j = i + 1; j < enemies.length; j++) {
        var b1 = enemies[j]; if (b1.dead) continue;
        var ox = b1.x - a1.x, oy = b1.y - a1.y, rr = a1.r + b1.r;
        if (ox > rr || ox < -rr || oy > rr || oy < -rr) continue;
        var dd = Math.hypot(ox, oy) || 0.01; if (dd < rr) { var push = (rr - dd) / 2, nx = ox / dd, ny = oy / dd; a1.x -= nx * push; a1.y -= ny * push; b1.x += nx * push; b1.y += ny * push; }
      }
    }
    // bullets
    for (i = bullets.length - 1; i >= 0; i--) {
      var b = bullets[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.life <= 0) { bullets.splice(i, 1); continue; }
      for (j = 0; j < enemies.length; j++) {
        var en = enemies[j]; if (en.dead || b.hit[en.id]) continue;
        if (Math.abs(en.x - b.x) < en.r + P.bsize && Math.abs(en.y - b.y) < en.r + P.bsize && K.dist(en.x, en.y, b.x, b.y) < en.r + P.bsize) {
          b.hit[en.id] = 1; hurt(en, P.dmg, b.vx * 0.12, b.vy * 0.12);
          if (b.pierce-- <= 0) { bullets.splice(i, 1); break; }
        }
      }
    }
    for (i = ebullets.length - 1; i >= 0; i--) {
      var eb = ebullets[i]; eb.x += eb.vx * dt; eb.y += eb.vy * dt; eb.life -= dt;
      if (eb.life <= 0) { ebullets.splice(i, 1); continue; }
      if (K.dist(eb.x, eb.y, P.x, P.y) < P.r + 5 && P.inv <= 0) { ebullets.splice(i, 1); P.hp -= 8; P.inv = 0.4; K.sfx("hit"); if (P.hp <= 0) { die(); return; } }
    }
    // blades
    P.bladeA += dt * 3.2;
    if (P.blades) for (k = 0; k < P.blades; k++) {
      var ba = P.bladeA + k * Math.PI * 2 / P.blades, bx = P.x + Math.cos(ba) * 64, by = P.y + Math.sin(ba) * 64;
      for (j = 0; j < enemies.length; j++) { var ee = enemies[j]; if (!ee.dead && K.dist(ee.x, ee.y, bx, by) < ee.r + 12) { ee.bladeT = (ee.bladeT || 0) - dt; if (ee.bladeT <= 0) { ee.bladeT = 0.3; hurt(ee, P.dmg * 0.8, Math.cos(ba) * 80, Math.sin(ba) * 80); } } }
    }
    enemies = enemies.filter(function (x) { return !x.dead; });
    // gems
    for (i = gems.length - 1; i >= 0; i--) {
      var gm = gems[i], gd = K.dist(gm.x, gm.y, P.x, P.y);
      if (gd < P.magnet || gm.pull) { gm.pull = true; var gs = 520 * dt; gm.x += (P.x - gm.x) / gd * gs; gm.y += (P.y - gm.y) / gd * gs; }
      if (gd < P.r + 8) { gems.splice(i, 1); P.xp += gm.v; K.tone(900 + Math.random() * 300, 0.03, { type: "triangle", vol: 0.05 }); if (P.xp >= P.need) { P.xp -= P.need; P.lvl++; P.need = Math.round(6 + P.lvl * 4.5); levelUp(); return; } }
    }
    cam.x = K.clamp(P.x - K.W / 2, -40, AW - K.W + 40); cam.y = K.clamp(P.y - K.H / 2, -40, AH - K.H + 40);
  }
  function die() { dead = true; deadT = 1.2; K.sfx("explode"); K.shake(16); fx.burst(P.x, P.y, 60, { color: [C.blue, C.cyan, "#fff"], speed: 300, life: 1 }); }

  function draw(ctx) {
    var W = K.W, H = K.H;
    ctx.save(); K.applyShake(ctx, 1 / 60);
    ctx.fillStyle = "#06061a"; ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.save(); ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
    // floor grid
    ctx.strokeStyle = "rgba(110,120,255,.09)"; ctx.lineWidth = 1; ctx.beginPath();
    var gx0 = Math.floor(cam.x / 60) * 60, gy0 = Math.floor(cam.y / 60) * 60;
    for (var x = gx0; x < cam.x + W + 60; x += 60) { ctx.moveTo(x, cam.y - 10); ctx.lineTo(x, cam.y + H + 10); }
    for (var y = gy0; y < cam.y + H + 60; y += 60) { ctx.moveTo(cam.x - 10, y); ctx.lineTo(cam.x + W + 10, y); }
    ctx.stroke();
    K.glow(ctx, C.purple, 18); ctx.strokeStyle = C.purple; ctx.lineWidth = 4; ctx.strokeRect(0, 0, AW, AH); K.noGlow(ctx);
    // gems
    gems.forEach(function (g) { ctx.fillStyle = g.v >= 4 ? C.yellow : g.v >= 3 ? C.green : C.cyan; ctx.beginPath(); ctx.moveTo(g.x, g.y - 6); ctx.lineTo(g.x + 5, g.y); ctx.lineTo(g.x, g.y + 6); ctx.lineTo(g.x - 5, g.y); ctx.fill(); });
    // enemies
    enemies.forEach(function (e) {
      if (e.x < cam.x - 60 || e.x > cam.x + W + 60 || e.y < cam.y - 60 || e.y > cam.y + H + 60) return;
      ctx.fillStyle = e.flash > 0 ? "#fff" : e.col;
      if (e.type === "brute" || e.type === "boss") { ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(t * (e.type === "boss" ? 0.8 : 1.4)); ctx.beginPath(); for (var k = 0; k < 6; k++) { var a = k * Math.PI / 3; ctx.lineTo(Math.cos(a) * e.r, Math.sin(a) * e.r); } ctx.closePath(); ctx.fill(); ctx.restore(); }
      else if (e.type === "runner") { ctx.beginPath(); var ang = Math.atan2(P.y - e.y, P.x - e.x); ctx.moveTo(e.x + Math.cos(ang) * e.r * 1.3, e.y + Math.sin(ang) * e.r * 1.3); ctx.lineTo(e.x + Math.cos(ang + 2.5) * e.r, e.y + Math.sin(ang + 2.5) * e.r); ctx.lineTo(e.x + Math.cos(ang - 2.5) * e.r, e.y + Math.sin(ang - 2.5) * e.r); ctx.fill(); }
      else if (e.type === "spitter") { ctx.fillRect(e.x - e.r, e.y - e.r, e.r * 2, e.r * 2); }
      else { ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = "rgba(10,8,30,.8)"; ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.38, 0, Math.PI * 2); ctx.fill();
      if (e.type === "brute" || e.type === "boss") { ctx.fillStyle = "rgba(255,255,255,.15)"; ctx.fillRect(e.x - e.r, e.y - e.r - 10, e.r * 2, 4); ctx.fillStyle = e.col; ctx.fillRect(e.x - e.r, e.y - e.r - 10, e.r * 2 * Math.max(0, e.hp / e.max), 4); }
    });
    // bullets
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = "#bff3ff"; bullets.forEach(function (b) { ctx.beginPath(); ctx.arc(b.x, b.y, P.bsize, 0, Math.PI * 2); ctx.fill(); });
    ctx.fillStyle = "rgba(47,184,255,.3)"; bullets.forEach(function (b) { ctx.beginPath(); ctx.arc(b.x, b.y, P.bsize + 4, 0, Math.PI * 2); ctx.fill(); });
    ctx.fillStyle = "rgba(61,255,168,.9)"; ebullets.forEach(function (b) { ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI * 2); ctx.fill(); });
    ctx.restore();
    // blades
    for (var k = 0; k < P.blades; k++) { var ba = P.bladeA + k * Math.PI * 2 / P.blades; ctx.save(); ctx.translate(P.x + Math.cos(ba) * 64, P.y + Math.sin(ba) * 64); ctx.rotate(ba * 3); K.glow(ctx, C.cyan, 12); ctx.fillStyle = C.cyan; ctx.fillRect(-12, -3, 24, 6); ctx.fillRect(-3, -12, 6, 24); K.noGlow(ctx); ctx.restore(); }
    // player
    if (!dead && (P.inv <= 0 || Math.floor(t * 18) % 2)) {
      ctx.save(); ctx.translate(P.x, P.y);
      ctx.strokeStyle = "rgba(47,184,255,.25)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, P.magnet, 0, Math.PI * 2); ctx.stroke();
      K.glow(ctx, C.blue, 18); var pg = ctx.createRadialGradient(-4, -4, 2, 0, 0, P.r); pg.addColorStop(0, "#e6f9ff"); pg.addColorStop(1, C.blue);
      ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(0, 0, P.r, 0, Math.PI * 2); ctx.fill(); K.noGlow(ctx);
      ctx.rotate(P.face); ctx.fillStyle = "#0b1030"; ctx.fillRect(4, -3, 7, 6);
      ctx.restore();
    }
    fx.draw(ctx);
    ctx.restore();
    // HUD
    ctx.fillStyle = "rgba(255,255,255,.1)"; ctx.fillRect(0, 0, W, 6);
    var xg = ctx.createLinearGradient(0, 0, W, 0); xg.addColorStop(0, C.cyan); xg.addColorStop(1, C.purple);
    ctx.fillStyle = xg; ctx.fillRect(0, 0, W * Math.min(1, P.xp / P.need), 6);
    K.text(ctx, K.time(time), W / 2, 30, { size: 26, color: "#fff", align: "center", glow: 10, glowColor: C.purple });
    K.text(ctx, "Level " + P.lvl, 14, 26, { size: 16, color: "#fff" });
    K.text(ctx, kills + " defeated", 14, 48, { size: 12, color: C.muted, family: "body", weight: 600 });
    ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(14, 60, 150, 9);
    ctx.fillStyle = P.hp / P.max > 0.3 ? C.green : C.red; ctx.fillRect(14, 60, 150 * Math.max(0, P.hp / P.max), 9);
    if (bossRef) { ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(W / 2 - 150, 52, 300, 8); ctx.fillStyle = C.red; ctx.fillRect(W / 2 - 150, 52, 300 * Math.max(0, bossRef.hp / bossRef.max), 8); }
    if (K.state === "play" && time < 6) K.text(ctx, "You shoot automatically. Just keep moving!", W / 2, H - 40, { size: 15, color: "#fff", align: "center", family: "body", weight: 600 });
    ctx.restore();
  }
  function start() {
    reset(); K.state = "play"; taken = {};
    if (K.thumb) { K.thumbTime = 0.35; time = 96; kills = 212; P.shots = 3; P.blades = 3; P.lvl = 9; for (var i = 0; i < 30; i++) spawn(K.pick(["chaser", "chaser", "runner", "brute", "spitter"])); enemies.forEach(function (e) { var a = Math.random() * 6.28, d = K.rand(110, 340); e.x = P.x + Math.cos(a) * d; e.y = P.y + Math.sin(a) * d * 0.7; }); for (i = 0; i < 20; i++) gems.push({ x: P.x + K.rand(-300, 300), y: P.y + K.rand(-200, 200), v: 1 }); cam.x = P.x - K.W / 2; cam.y = P.y - K.H / 2; }
  }
  K.onRestart = start;
  reset();
  K.menu({ title: "Arena Survivor", body: "Survive the swarm as long as you can. You fire at the closest enemy by yourself, so focus on moving with <kbd>WASD</kbd>, <kbd>Arrows</kbd> or by dragging on touch screens. Collect gems to level up and pick upgrades.", onStart: start });
  K.loop(update, draw);
})();
</script>
</body>
</html>
